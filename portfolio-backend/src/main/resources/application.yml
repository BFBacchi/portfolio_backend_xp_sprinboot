spring:
  application:
    name: portfolio-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DATABASE_USER:portfolio}
    password: ${DATABASE_PASSWORD:portfolio}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

portfolio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  bootstrap:
    admin-username: ${PORTFOLIO_ADMIN:admin}
    admin-password: ${PORTFOLIO_ADMIN_PASSWORD:changeme}

jwt:
  # En producción usar variable de entorno con secreto largo (≥ 256 bits para HS256)
  secret: ${JWT_SECRET:dev-portfolio-jwt-secret-change-in-production-min-32-chars!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
